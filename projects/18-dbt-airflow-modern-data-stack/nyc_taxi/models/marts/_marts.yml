version: 2
models:
  - name: fct_trips
    description: "One row per valid yellow-taxi trip. Grain: trip_key. Incremental by source_month."
    config:
      contract: {enforced: false}
    columns:
      - name: trip_key
        description: "Surrogate key (md5 of identifying fields)"
        data_tests: [unique, not_null]
      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
      - name: total_amount
        data_tests: [not_null, non_negative]
      - name: duration_min
        data_tests:
          - in_range: {arguments: {min_value: 0, max_value: 360, inclusive_min: false}}
  - name: dim_zones
    description: "Taxi zones with an airport flag."
    columns:
      - name: location_id
        data_tests: [unique, not_null]
  - name: agg_daily_borough
    description: "Daily trips, revenue, average fare / duration / distance and card tip rate by pickup borough."
    data_tests:
      - unique_combination:
          arguments: {columns: ["trip_date", "pickup_borough"]}
  - name: agg_hour_of_week
    description: "Average trips per hour of week."
  - name: dq_rejections_by_month
    description: "Rows removed by each data-quality rule, per file month."

exposures:
  - name: ops_kpi_dashboard
    type: dashboard
    maturity: medium
    description: "Daily borough KPIs and hour-of-week demand (reports/ in this project)."
    depends_on: [ref('agg_daily_borough'), ref('agg_hour_of_week'), ref('dq_rejections_by_month')]
    owner: {name: Owen Quigley}

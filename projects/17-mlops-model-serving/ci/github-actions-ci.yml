# GitHub Actions workflow for project 17.
# To activate it, copy this file to .github/workflows/mlops-ci.yml at the
# repository root (pushing workflow files needs a token with the `workflow` scope).
name: mlops-ci

on:
  push:
    paths: ["projects/17-mlops-model-serving/**"]
  pull_request:
    paths: ["projects/17-mlops-model-serving/**"]

defaults:
  run:
    working-directory: projects/17-mlops-model-serving

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/17-mlops-model-serving/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and API tests (use the committed model; no download needed)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bike-demand-api:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 bike-demand-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d @tests/sample_request.json
          docker logs api
